name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s scripts -v
      - name: CLI smoke test
        run: |
          python scripts/aff_tools.py earn --price 399 --rate 10 --views 10000 --ctr 1 --cvr 3
          echo "ใช้แล้วดีมาก #โฆษณา" | python scripts/aff_tools.py lint -
